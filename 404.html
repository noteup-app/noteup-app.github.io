<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · NoteUp!</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="/images/icon-32.png">
<link rel="icon" type="image/svg+xml" href="/images/icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/images/logo-180.png">
<script>
// GitHub Pages serves this page for every missing address, so the language comes from the address or the browser
if (location.pathname.startsWith("/de/") || /^de\b/i.test(navigator.language || "")) document.documentElement.lang = "de";
</script>
<style>
:root {
  --bg: #f5f5f3; --ink: #0b0b0b; --muted: #52514e; --accent: #4a7a64; --on-accent: #fff; --wrong: #c0362c;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111110; --ink: #f0efec; --muted: #c3c2b7; --accent: #93c4ab; --on-accent: #111110; --wrong: #ff7b6e; color-scheme: dark; }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased;
}
main { max-width: 360px; padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); text-align: center; }
.logo { width: 132px; height: auto; overflow: visible; }
/* the arrow marks the target and stays, only the note swings past it */
.logo .target { color: var(--wrong); }
.logo .needle { color: var(--wrong); transform-origin: 256px 355.6px; transform: rotate(-30deg); animation: miss 1.4s ease-out; }
@keyframes miss { 0% { transform: rotate(0); } 45% { transform: rotate(-38deg); } 75% { transform: rotate(-26deg); } 100% { transform: rotate(-30deg); } }
@media (prefers-reduced-motion: reduce) { .logo .needle { animation: none; } }
.code { margin: 18px 0 0; color: var(--muted); font-weight: 600; letter-spacing: .08em; }
h1 { margin: 4px 0 8px; font-size: 28px; letter-spacing: -.01em; }
p { margin: 0 0 22px; color: var(--muted); }
.btn {
  min-height: 44px; padding: 6px 18px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 600;
  display: inline-flex; align-items: center; text-decoration: none;
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
html[lang="de"] [lang="en"], html[lang="en"] [lang="de"] { display: none; }
</style>
</head>
<body>
<main>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="56 102 400 308" class="logo" aria-hidden="true"><g stroke="currentColor" stroke-linecap="round" opacity=".45"><path d="M256,156 V128" stroke-width="14" transform="rotate(-20 256 355.6)"/><path d="M256,156 V128" stroke-width="14" transform="rotate(+20 256 355.6)"/><path d="M256,154 V131" stroke-width="12" stroke-opacity=".75" transform="rotate(-40 256 355.6)"/><path d="M256,154 V131" stroke-width="12" stroke-opacity=".75" transform="rotate(+40 256 355.6)"/><path d="M256,152 V134" stroke-width="10" stroke-opacity=".5" transform="rotate(-60 256 355.6)"/><path d="M256,152 V134" stroke-width="10" stroke-opacity=".5" transform="rotate(+60 256 355.6)"/></g><polyline class="target" points="230,140 256,114 282,140" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><g class="needle"><path d="M256,352 V178" stroke="currentColor" stroke-width="21" stroke-linecap="round"/><ellipse cx="215" cy="368" rx="52" ry="36" transform="rotate(-24 215 368)" fill="currentColor"/></g></svg>
  <p class="code">404</p>
  <div lang="en">
    <h1>Missed!</h1>
    <p>This page doesn't exist. Maybe the address is wrong or out of date.</p>
    <a class="btn" href="/">Open NoteUp!</a>
  </div>
  <div lang="de">
    <h1>Daneben!</h1>
    <p>Diese Seite gibt es nicht. Vielleicht ist die Adresse falsch oder veraltet.</p>
    <a class="btn" href="/de/">NoteUp! öffnen</a>
  </div>
</main>
<script>
// the title follows the language as well
if (document.documentElement.lang === "de") document.title = "Seite nicht gefunden · NoteUp!";
</script>
</body>
</html>
